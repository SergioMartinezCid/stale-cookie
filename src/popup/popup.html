<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="popupTitle">Stale Cookie</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: var(--space-3);
        font-size: var(--font-md);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      #options {
        padding: 4px 6px;
        line-height: 0;
        color: var(--text-muted);
      }
      #scan {
        width: 100%;
      }
      #reminder-banner {
        margin: 0 0 var(--space-2);
        padding: var(--space-1) var(--space-2);
        border-left: 3px solid var(--warning);
        background: color-mix(in srgb, var(--warning) 10%, transparent);
        font-size: var(--font-sm);
      }
      #reminder-banner[hidden] {
        display: none;
      }
      #actions {
        display: flex;
        gap: var(--space-2);
      }
      #actions button {
        flex: 1;
        margin-top: var(--space-2);
      }
      #undo-detail {
        margin: 2px 0 0;
        color: var(--text-muted);
        font-size: var(--font-xs);
      }
      h2 {
        margin: 12px 0 2px;
        font-size: var(--font-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      h2 label {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      #results {
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        column-gap: var(--space-2);
        row-gap: 2px;
        padding: var(--space-2) var(--space-1);
        border-bottom: 1px solid var(--border);
      }
      li:hover {
        background: var(--bg-subtle);
      }
      li .site {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        /* Let the domain ellipsize instead of widening the popup. */
        min-width: 0;
      }
      li .domain {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li .meta {
        /* Second line, structurally aligned under the site column. */
        grid-column: 2;
        color: var(--text-muted);
        font-size: var(--font-xs);
        font-variant-numeric: tabular-nums;
      }
      .badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        color: var(--text-muted);
        white-space: nowrap;
      }
      .protect {
        grid-column: 3;
        grid-row: 1;
        font-size: var(--font-xs);
        padding: 2px 8px;
      }
      #footer {
        /* Visually anchored action bar — marks the scroll boundary of the
           results list above it. */
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-top: var(--space-2);
        border-top: 1px solid var(--border);
      }
      #footer[hidden] {
        display: none;
      }
      #confirm {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      #confirm[hidden] {
        display: none;
      }
      #confirm-text {
        flex-basis: 100%;
        color: var(--warning);
      }
      #status {
        margin: 8px 0 0;
        color: var(--text-muted);
      }
      #status.success {
        color: var(--success);
      }
      #status.idle {
        text-align: center;
      }
      #empty-hero {
        margin-top: var(--space-4);
        text-align: center;
        color: var(--text-muted);
      }
      #status.scanning::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        vertical-align: -1px;
      }
      /* All motion stays behind the user's preference. */
      @media (prefers-reduced-motion: no-preference) {
        #status.scanning::before {
          animation: spin 0.8s linear infinite;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #toast {
        margin: 8px 0 0;
      }
      #toast[hidden] {
        display: none;
      }
      #toast.success {
        color: var(--success);
      }
      #toast.error {
        border-left: 3px solid var(--danger);
        padding: var(--space-1) var(--space-2);
        background: color-mix(in srgb, var(--danger) 8%, transparent);
      }
      #summary {
        margin: 8px 0 0;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="popupTitle"></h1>
      <!-- Gear glyph from Bootstrap Icons (gear-fill, MIT). The accessible
           name is set from i18n in popup.ts — no data-i18n here, it would
           overwrite the SVG. -->
      <button id="options" class="quiet">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"
          />
        </svg>
      </button>
    </header>
    <p id="reminder-banner" hidden></p>
    <button id="scan" class="primary" data-i18n="popupScanButton"></button>
    <div id="actions">
      <button id="skip" data-i18n="popupSkipReminder" hidden></button>
      <button id="undo" hidden></button>
    </div>
    <p id="undo-detail" hidden></p>
    <p id="toast" role="status" hidden></p>
    <div id="empty-hero" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9" />
        <circle cx="9" cy="9" r="1" fill="currentColor" stroke="none" />
        <circle cx="14.5" cy="8" r="1" fill="currentColor" stroke="none" />
        <circle cx="15.5" cy="13.5" r="1" fill="currentColor" stroke="none" />
        <circle cx="9" cy="14.5" r="1" fill="currentColor" stroke="none" />
        <circle cx="12.5" cy="17" r="1" fill="currentColor" stroke="none" />
      </svg>
    </div>
    <p id="status" class="idle" role="status" data-i18n="popupNoScanYet"></p>
    <div id="results" hidden>
      <h2 id="stale-head">
        <label><input type="checkbox" id="stale-all" /><span id="stale-title"></span></label>
      </h2>
      <ul id="stale-list"></ul>
      <h2 id="unknown-head">
        <label><input type="checkbox" id="unknown-all" /><span id="unknown-title"></span></label>
      </h2>
      <ul id="unknown-list"></ul>
      <p id="summary"></p>
    </div>
    <div id="footer" hidden>
      <button id="delete" class="danger"></button>
      <div id="confirm" hidden>
        <span id="confirm-text"></span>
        <button id="confirm-delete" class="danger" data-i18n="popupConfirmDeleteButton"></button>
        <button id="confirm-cancel" data-i18n="popupCancel"></button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
