<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      #options {
        font-size: 11px;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 13px;
      }
      #results {
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        padding: 4px 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      li .domain {
        flex: 1;
        min-width: 6em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li .meta {
        /* Full-width second line, aligned under the domain. */
        flex-basis: 100%;
        padding-left: 22px;
        opacity: 0.65;
        font-size: 11px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 8px;
        border: 1px solid currentColor;
        opacity: 0.8;
        white-space: nowrap;
      }
      .protect {
        font-size: 11px;
      }
      #footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      #footer[hidden] {
        display: none;
      }
      #confirm {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      #confirm[hidden] {
        display: none;
      }
      #confirm-text {
        flex-basis: 100%;
        color: #c05000;
      }
      #confirm-delete {
        color: #d70022;
      }
      #status {
        margin: 8px 0 0;
        opacity: 0.7;
      }
      #summary {
        margin: 8px 0 0;
        opacity: 0.7;
      }
      button:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="popupTitle"></h1>
      <button id="options" data-i18n="popupOptionsButton"></button>
    </header>
    <button id="scan" data-i18n="popupScanButton"></button>
    <button id="skip" data-i18n="popupSkipReminder" hidden></button>
    <p id="status" data-i18n="popupNoScanYet"></p>
    <div id="results" hidden>
      <h2 id="stale-title"></h2>
      <ul id="stale-list"></ul>
      <h2 id="unknown-title"></h2>
      <ul id="unknown-list"></ul>
      <p id="summary"></p>
    </div>
    <div id="footer" hidden>
      <button id="delete"></button>
      <div id="confirm" hidden>
        <span id="confirm-text"></span>
        <button id="confirm-delete" data-i18n="popupConfirmDeleteButton"></button>
        <button id="confirm-cancel" data-i18n="popupCancel"></button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
