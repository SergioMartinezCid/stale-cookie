<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Stale Cookie settings</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-5);
        font-size: 14px;
      }
      h1 {
        font-size: var(--font-xl);
      }
      h2 {
        font-size: var(--font-lg);
        margin: 0 0 4px;
      }
      section {
        padding: var(--space-4) 0;
        border-top: 1px solid var(--border);
      }
      section.danger-zone {
        margin-top: var(--space-4);
        padding: var(--space-4);
        border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        border-radius: var(--radius-card);
        background: color-mix(in srgb, var(--danger) 6%, transparent);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .type-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 440px;
        padding: 4px 0;
      }
      .type-row input[type='number'] {
        width: 5em;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-width: 360px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .hint {
        color: var(--text-muted);
        font-size: var(--font-md);
      }
      #saved {
        color: var(--text-muted);
        font-size: var(--font-md);
        visibility: hidden;
      }
      #global-status {
        color: var(--text-muted);
        font-size: var(--font-md);
        margin: 8px 0 0;
      }
      #global-clear {
        margin-top: 8px;
      }
      .danger-note {
        font-weight: 600;
      }
      #threshold-warning {
        color: var(--warning);
        font-size: var(--font-md);
      }
      .import-row {
        margin-top: 8px;
      }
      .log-list {
        max-width: none;
        max-height: 180px;
        overflow-y: auto;
        font-size: 13px;
      }
      .log-list li {
        justify-content: flex-start;
      }
      .log-list li span:last-child {
        overflow-wrap: anywhere;
      }
      .log-time {
        color: var(--text-muted);
        white-space: nowrap;
      }
      #export-logs {
        margin-top: 8px;
      }
      h3 {
        font-size: var(--font-md);
        margin: 16px 0 4px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle"></h1>

    <section>
      <h2 data-i18n="optionsTypesTitle"></h2>
      <p class="hint" data-i18n="optionsTypesHint"></p>
      <div class="type-row">
        <label><input type="checkbox" checked disabled /><span data-i18n="typeCookies"></span></label>
        <label
          ><input type="number" id="cookie-threshold" min="1" max="3650" /><span
            data-i18n="optionsDaysLabel"
          ></span
        ></label>
      </div>
      <div class="type-row">
        <label><input type="checkbox" id="clear-history" /><span data-i18n="typeHistory"></span></label>
        <label
          ><input type="number" id="history-threshold" min="1" max="3650" /><span
            data-i18n="optionsDaysLabel"
          ></span
        ></label>
      </div>
      <div class="type-row">
        <label
          ><input type="checkbox" id="clear-downloads" /><span data-i18n="typeDownloads"></span
        ></label>
        <label
          ><input type="number" id="download-threshold" min="1" max="3650" /><span
            data-i18n="optionsDaysLabel"
          ></span
        ></label>
      </div>
      <p class="hint" id="permission-note" hidden data-i18n="optionsPermissionDenied"></p>
      <p id="threshold-warning" hidden data-i18n="optionsThresholdWarning"></p>
    </section>

    <section>
      <h2 data-i18n="optionsUnknownTitle"></h2>
      <label>
        <input type="checkbox" id="keep-unknown" />
        <span data-i18n="optionsKeepUnknownLabel"></span>
      </label>
      <p class="hint" data-i18n="optionsKeepUnknownHint"></p>
    </section>

    <section>
      <h2 data-i18n="optionsAutoTitle"></h2>
      <p class="hint" data-i18n="optionsAutoHint"></p>
      <label
        ><input type="checkbox" id="auto-clean" /><span data-i18n="optionsAutoEnableLabel"></span
      ></label>
      <div class="type-row">
        <span data-i18n="optionsAutoDaysLabel"></span>
        <label
          ><input type="number" id="auto-clean-days" min="1" max="3650" /><span
            data-i18n="optionsDaysLabel"
          ></span
        ></label>
      </div>
    </section>

    <section id="reminder-section">
      <h2 data-i18n="optionsReminderTitle"></h2>
      <p class="hint" id="reminder-auto-note" hidden data-i18n="optionsReminderAutoNote"></p>
      <div class="type-row">
        <span data-i18n="optionsReminderDaysLabel"></span>
        <label
          ><input type="number" id="reminder-days" min="1" max="3650" /><span
            data-i18n="optionsDaysLabel"
          ></span
        ></label>
      </div>
      <label
        ><input type="checkbox" id="reminder-badge" /><span
          data-i18n="optionsReminderBadgeLabel"
        ></span
      ></label>
      <label
        ><input type="checkbox" id="reminder-notification" /><span
          data-i18n="optionsReminderNotificationLabel"
        ></span
      ></label>
      <p class="hint" id="reminder-permission-note" hidden data-i18n="optionsPermissionDenied"></p>
    </section>

    <section>
      <h2 data-i18n="optionsWhitelistTitle"></h2>
      <p class="hint" data-i18n="optionsWhitelistHint"></p>
      <form id="whitelist-form">
        <input type="text" id="whitelist-input" placeholder="example.com" />
        <button type="submit" data-i18n="optionsAdd"></button>
      </form>
      <ul id="whitelist"></ul>
    </section>

    <section>
      <h2 data-i18n="optionsConfigTitle"></h2>
      <p class="hint" data-i18n="optionsConfigHint"></p>
      <button id="export-config" data-i18n="optionsExportButton"></button>
      <label class="import-row"
        ><span data-i18n="optionsImportButton"></span
        ><input type="file" id="import-file" accept=".json,application/json"
      /></label>
      <p id="config-status" class="hint"></p>
    </section>

    <section>
      <h2 data-i18n="optionsLogsTitle"></h2>
      <p class="hint" data-i18n="optionsLogsHint"></p>
      <h3 id="action-log-title"></h3>
      <ul id="action-log" class="log-list"></ul>
      <p class="hint" id="action-log-empty" hidden data-i18n="optionsActionLogEmpty"></p>
      <h3 id="error-log-title"></h3>
      <ul id="error-log" class="log-list"></ul>
      <p class="hint" id="error-log-empty" hidden data-i18n="optionsErrorLogEmpty"></p>
      <label
        ><input type="checkbox" id="logs-anonymize" checked /><span
          data-i18n="optionsLogsAnonymize"
        ></span
      ></label>
      <p class="hint" data-i18n="optionsLogsAnonymizeHint"></p>
      <button id="export-logs" data-i18n="optionsLogsExportButton"></button>
    </section>

    <!-- Deliberately last: the one destructive action without a preview. -->
    <section class="danger-zone">
      <h2 data-i18n="optionsGlobalTitle"></h2>
      <p class="hint danger-note" data-i18n="optionsGlobalHint"></p>
      <label><input type="checkbox" id="global-cache" checked /><span data-i18n="optionsGlobalCache"></span></label>
      <label
        ><input type="checkbox" id="global-form-data" checked /><span
          data-i18n="optionsGlobalFormData"
        ></span
      ></label>
      <button id="global-clear" class="danger" data-i18n="optionsGlobalButton"></button>
      <p id="global-status"></p>
    </section>

    <p id="saved" data-i18n="optionsSaved"></p>
    <script src="options.js"></script>
  </body>
</html>
