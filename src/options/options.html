<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Stale Cookie settings</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-5);
        font-size: 14px;
      }
      h1 {
        font-size: var(--font-xl);
      }
      h2 {
        font-size: var(--font-lg);
        margin: 0 0 4px;
      }
      section {
        padding: var(--space-4) 0;
        border-top: 1px solid var(--border);
      }
      section.danger-zone {
        margin-top: var(--space-4);
        padding: var(--space-4);
        border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        border-radius: var(--radius-card);
        background: color-mix(in srgb, var(--danger) 6%, transparent);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .type-row {
        /* Shared two-column grid so every "N days" control lines up in the
           same column page-wide, not wherever space-between dropped it. */
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 16px;
        max-width: 440px;
        padding: 4px 0;
      }
      .type-row input[type='number'] {
        width: 5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-width: 360px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .hint {
        color: var(--text-muted);
        font-size: var(--font-md);
      }
      #saved {
        /* Fixed corner toast — the page is long and the changed control
           can be anywhere; an indicator at the bottom of the flow was
           invisible from where the user was editing. */
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        margin: 0;
        padding: var(--space-2) var(--space-4);
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-ctrl);
        color: var(--text);
        font-size: var(--font-md);
        visibility: hidden;
      }
      #global-status {
        color: var(--text-muted);
        font-size: var(--font-md);
        margin: 8px 0 0;
      }
      #global-clear {
        margin-top: 8px;
      }
      .danger-note {
        font-weight: 600;
      }
      #threshold-warning {
        color: var(--warning);
        font-size: var(--font-md);
      }
      .import-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .field-error {
        color: var(--danger);
        font-size: var(--font-md);
      }
      .log-scroll {
        /* Focusable scroll region — without a tab stop, keyboard users
           could never scroll past the first visible entries. */
        max-height: 180px;
        overflow-y: auto;
      }
      .log-list {
        max-width: none;
        font-size: 13px;
      }
      .log-list details {
        flex: 1;
        min-width: 0;
      }
      .log-list pre {
        margin: 4px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .log-list li {
        justify-content: flex-start;
      }
      .log-list li span:last-child {
        overflow-wrap: anywhere;
      }
      .log-time {
        color: var(--text-muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #error-log li {
        border-left: 2px solid color-mix(in srgb, var(--danger) 50%, transparent);
        padding-left: 6px;
      }
      #error-log li :is(span:last-child, summary, pre) {
        font-family: ui-monospace, monospace;
        font-size: var(--font-sm);
      }
      .config-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-4);
        margin-top: 8px;
      }
      #export-logs {
        margin-top: 8px;
      }
      h3 {
        font-size: var(--font-md);
        margin: 16px 0 4px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle"></h1>

    <section>
      <h2 data-i18n="optionsTypesTitle"></h2>
      <p class="hint" data-i18n="optionsTypesHint"></p>
      <!-- The days inputs take their accessible name from the row subject
           plus the unit — a wrapping label alone would name them all "days". -->
      <div class="type-row">
        <label
          ><input type="checkbox" checked disabled /><span
            data-i18n="typeCookies"
            id="cookies-subject"
          ></span
        ></label>
        <label
          ><input
            type="number"
            id="cookie-threshold"
            min="1"
            max="3650"
            aria-labelledby="cookies-subject cookie-days-unit"
          /><span data-i18n="optionsDaysLabel" id="cookie-days-unit"></span
        ></label>
      </div>
      <div class="type-row">
        <label
          ><input type="checkbox" id="clear-history" /><span
            data-i18n="typeHistory"
            id="history-subject"
          ></span
        ></label>
        <label
          ><input
            type="number"
            id="history-threshold"
            min="1"
            max="3650"
            aria-labelledby="history-subject history-days-unit"
          /><span data-i18n="optionsDaysLabel" id="history-days-unit"></span
        ></label>
      </div>
      <div class="type-row">
        <label
          ><input type="checkbox" id="clear-downloads" /><span
            data-i18n="typeDownloads"
            id="downloads-subject"
          ></span
        ></label>
        <label
          ><input
            type="number"
            id="download-threshold"
            min="1"
            max="3650"
            aria-labelledby="downloads-subject download-days-unit"
          /><span data-i18n="optionsDaysLabel" id="download-days-unit"></span
        ></label>
      </div>
      <p class="hint" id="permission-note" role="alert" hidden data-i18n="optionsPermissionDenied"></p>
      <p id="threshold-warning" role="alert" hidden data-i18n="optionsThresholdWarning"></p>
    </section>

    <section>
      <h2 data-i18n="optionsUnknownTitle"></h2>
      <label>
        <input type="checkbox" id="keep-unknown" />
        <span data-i18n="optionsKeepUnknownLabel"></span>
      </label>
      <p class="hint" data-i18n="optionsKeepUnknownHint"></p>
    </section>

    <section>
      <h2 data-i18n="optionsAutoTitle"></h2>
      <p class="hint" data-i18n="optionsAutoHint"></p>
      <label
        ><input type="checkbox" id="auto-clean" /><span data-i18n="optionsAutoEnableLabel"></span
      ></label>
      <div class="type-row">
        <span data-i18n="optionsAutoDaysLabel" id="auto-days-subject"></span>
        <label
          ><input
            type="number"
            id="auto-clean-days"
            min="1"
            max="3650"
            aria-labelledby="auto-days-subject auto-days-unit"
          /><span data-i18n="optionsDaysLabel" id="auto-days-unit"></span
        ></label>
      </div>
    </section>

    <section id="reminder-section">
      <h2 data-i18n="optionsReminderTitle"></h2>
      <p class="hint" id="reminder-auto-note" hidden data-i18n="optionsReminderAutoNote"></p>
      <div class="type-row">
        <span data-i18n="optionsReminderDaysLabel" id="reminder-days-subject"></span>
        <label
          ><input
            type="number"
            id="reminder-days"
            min="1"
            max="3650"
            aria-labelledby="reminder-days-subject reminder-days-unit"
          /><span data-i18n="optionsDaysLabel" id="reminder-days-unit"></span
        ></label>
      </div>
      <label
        ><input type="checkbox" id="reminder-badge" /><span
          data-i18n="optionsReminderBadgeLabel"
        ></span
      ></label>
      <label
        ><input type="checkbox" id="reminder-notification" /><span
          data-i18n="optionsReminderNotificationLabel"
        ></span
      ></label>
      <p class="hint" id="reminder-permission-note" role="alert" hidden data-i18n="optionsPermissionDenied"></p>
    </section>

    <section>
      <h2 data-i18n="optionsWhitelistTitle"></h2>
      <p class="hint" data-i18n="optionsWhitelistHint"></p>
      <form id="whitelist-form">
        <label for="whitelist-input" class="sr-only" data-i18n="optionsWhitelistInputLabel"></label>
        <input type="text" id="whitelist-input" placeholder="example.com" />
        <button type="submit" data-i18n="optionsAdd"></button>
      </form>
      <p id="whitelist-status" class="field-error" role="alert" hidden></p>
      <ul id="whitelist"></ul>
    </section>

    <section>
      <h2 data-i18n="optionsConfigTitle"></h2>
      <p class="hint" data-i18n="optionsConfigHint"></p>
      <div class="config-actions">
        <button id="export-config" data-i18n="optionsExportButton"></button>
        <label class="import-row"
          ><span data-i18n="optionsImportButton"></span
          ><input type="file" id="import-file" accept=".json,application/json"
        /></label>
      </div>
      <p id="config-status" class="hint" role="status"></p>
    </section>

    <section>
      <h2 data-i18n="optionsLogsTitle"></h2>
      <p class="hint" data-i18n="optionsLogsHint"></p>
      <h3 id="action-log-title"></h3>
      <div class="log-scroll" tabindex="0" role="region" aria-labelledby="action-log-title">
        <ul id="action-log" class="log-list"></ul>
      </div>
      <p class="hint" id="action-log-empty" hidden data-i18n="optionsActionLogEmpty"></p>
      <h3 id="error-log-title"></h3>
      <div class="log-scroll" tabindex="0" role="region" aria-labelledby="error-log-title">
        <ul id="error-log" class="log-list"></ul>
      </div>
      <p class="hint" id="error-log-empty" hidden data-i18n="optionsErrorLogEmpty"></p>
      <label
        ><input type="checkbox" id="logs-anonymize" checked /><span
          data-i18n="optionsLogsAnonymize"
        ></span
      ></label>
      <p class="hint" data-i18n="optionsLogsAnonymizeHint"></p>
      <button id="export-logs" data-i18n="optionsLogsExportButton"></button>
    </section>

    <!-- Deliberately last: the one destructive action without a preview. -->
    <section class="danger-zone">
      <h2 data-i18n="optionsGlobalTitle"></h2>
      <p class="hint danger-note" data-i18n="optionsGlobalHint"></p>
      <label><input type="checkbox" id="global-cache" checked /><span data-i18n="optionsGlobalCache"></span></label>
      <label
        ><input type="checkbox" id="global-form-data" checked /><span
          data-i18n="optionsGlobalFormData"
        ></span
      ></label>
      <button id="global-clear" class="danger" data-i18n="optionsGlobalButton"></button>
      <p id="global-status" role="status"></p>
    </section>

    <p id="saved" role="status" data-i18n="optionsSaved"></p>
    <script src="options.js"></script>
  </body>
</html>
