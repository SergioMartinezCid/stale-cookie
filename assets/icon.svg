<?xml version="1.0" encoding="UTF-8"?>
<!-- Stale Cookie icon: a cookie as a clock face (staleness = time since the
     last visit). Standard variant — dark outlines, for light toolbars and
     everywhere a full-color icon is shown. Rendered to PNGs by
     `npm run build:icons`; keep both SVG variants in sync. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="55" fill="#c98a4b" stroke="#7a4e22" stroke-width="7" />
  <!-- chocolate chips, kept clear of the hands -->
  <circle cx="40" cy="38" r="7" fill="#6b4423" />
  <circle cx="76" cy="27" r="6" fill="#6b4423" />
  <circle cx="97" cy="52" r="6" fill="#6b4423" />
  <circle cx="29" cy="68" r="6" fill="#6b4423" />
  <circle cx="45" cy="95" r="7" fill="#6b4423" />
  <circle cx="96" cy="93" r="6" fill="#6b4423" />
  <!-- clock hands: minute at 12, hour toward 4 -->
  <g stroke="#3d2814" stroke-width="12" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="33" />
    <line x1="64" y1="64" x2="83" y2="78" />
  </g>
  <circle cx="64" cy="64" r="6" fill="#3d2814" />
</svg>
